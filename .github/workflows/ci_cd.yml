name: ScamShield AI MLOps & Backend CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'mlops/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'mlops/**'
      - '.github/workflows/**'

jobs:
  ci_cd_pipeline:
    name: ScamShield AI CI/CD Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mlops/requirements.txt
          pip install httpx pytest

      - name: Stage 1 - Code Syntax & Config Linting
        run: |
          PYTHONPATH=mlops python mlops/run_ci_cd.py --stage 1

      - name: Stage 2 - Preprocessing Pipeline Validation
        run: |
          PYTHONPATH=mlops python mlops/run_ci_cd.py --stage 2

      - name: Stage 3 - Automated Unit & Integration Test Suite
        run: |
          PYTHONPATH=mlops python mlops/run_ci_cd.py --stage 3

      - name: Stage 4 - Model Validation & Performance Gatekeeping
        run: |
          PYTHONPATH=mlops python mlops/run_ci_cd.py --stage 4

      - name: Stage 5 - FastAPI Backend Microservice Smoke Test
        run: |
          PYTHONPATH=mlops python mlops/run_ci_cd.py --stage 5
